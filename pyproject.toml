[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagrivane"
version = "0.1.0"
description = "Inspect local command workflows and verify data release gates."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["dagrivane"]

[tool.setuptools.package-data]
dagrivane = ["static/*"]
