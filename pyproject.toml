[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagrivane"
version = "0.2.0"
description = "Inspect local command workflows and verify data release gates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["dagrivane"]

[tool.setuptools.package-data]
dagrivane = ["static/*"]

[tool.setuptools.cmdclass]
build_py = "_build.PackagedExamples"
